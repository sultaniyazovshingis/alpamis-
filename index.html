<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pirniyazov Alpamis — AI/ML mutaxassisi</title>
<style>
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
:root{--bg:#eef1fb;--card:rgba(255,255,255,.7);--tx:#0b1020;--mut:#566079;--line:rgba(11,16,32,.1);--a:#6d5efc;--b:#00c2e0;--c:#ff4fa3;--dot:90,100,200;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05070f;--card:rgba(14,19,38,.62);--tx:#f1f4ff;--mut:#9aa5c4;--line:rgba(255,255,255,.1);--dot:120,140,255}}
:root[data-theme="dark"]{--bg:#05070f;--card:rgba(14,19,38,.62);--tx:#f1f4ff;--mut:#9aa5c4;--line:rgba(255,255,255,.1);--dot:120,140,255}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(1200px 700px at 20% -10%,rgba(109,94,252,.28),transparent 60%),radial-gradient(900px 600px at 100% 110%,rgba(0,194,224,.22),transparent 60%),var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px 16px;overflow-x:hidden}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.stage{position:relative;z-index:1;width:100%;max-width:540px;perspective:1200px;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.card{position:relative;border-radius:32px;padding:2px;background:conic-gradient(from var(--ang),var(--a),var(--b),var(--c),var(--a));animation:ang 6s linear infinite;transition:transform .2s ease-out;transform-style:preserve-3d;box-shadow:0 40px 90px -30px rgba(109,94,252,.55)}
@keyframes ang{to{--ang:360deg}}
.in{border-radius:30px;background:var(--card);backdrop-filter:blur(26px) saturate(1.4);-webkit-backdrop-filter:blur(26px) saturate(1.4);padding:36px 28px 28px;position:relative;overflow:hidden}
.in::before{content:"";position:absolute;inset:0;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.14),transparent 60%);pointer-events:none}
.av{position:relative;width:118px;height:118px;margin:0 auto 20px;display:grid;place-items:center}
.av .core{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:32px;font-weight:800;letter-spacing:.02em;color:#fff;background:linear-gradient(135deg,var(--a),var(--b) 60%,var(--c));box-shadow:0 0 40px rgba(109,94,252,.6),inset 0 0 20px rgba(255,255,255,.25);animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 60px rgba(0,194,224,.7),inset 0 0 20px rgba(255,255,255,.25)}}
.ring{position:absolute;inset:0;border-radius:50%;border:1.5px dashed rgba(var(--dot),.5);animation:spin 14s linear infinite}
.ring.r2{inset:-9px;border-style:solid;border-color:transparent;border-top-color:var(--b);border-bottom-color:var(--c);animation-duration:6s;animation-direction:reverse}
.ring i{position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--b);box-shadow:0 0 12px var(--b)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{text-align:center;font-size:clamp(28px,8vw,38px);letter-spacing:-.03em;line-height:1.05;font-weight:800}
.grad{background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--a));background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:250% center}}
.badge{display:table;margin:14px auto 0;padding:7px 15px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;background:rgba(var(--dot),.1)}
.badge::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:8px;box-shadow:0 0 10px #22c55e;animation:blink 1.6s ease-in-out infinite}
.role{text-align:center;color:var(--mut);margin-top:16px;font-size:16px;min-height:24px}
.cur{display:inline-block;width:2px;height:1em;background:var(--b);vertical-align:-2px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.15}}
h2{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mut);margin:30px 0 14px;display:flex;align-items:center;gap:12px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.skill{margin-bottom:14px;opacity:0;transform:translateX(-16px);transition:.8s cubic-bezier(.2,.8,.2,1)}
.on .skill{opacity:1;transform:none}
.row{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:7px}
.row i{font-style:normal;color:var(--mut);font-weight:500}
.bar{height:8px;border-radius:99px;background:rgba(var(--dot),.14);overflow:hidden}
.bar div{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b),var(--c));background-size:200% 100%;box-shadow:0 0 14px rgba(0,194,224,.6);transition:width 1.6s cubic-bezier(.2,.8,.2,1);animation:shine 4s linear infinite}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(var(--dot),.07);font-size:13px;font-weight:500;transition:.25s}
.tags span:hover{transform:translateY(-4px) scale(1.04);border-color:var(--b);box-shadow:0 10px 24px -10px var(--b)}
.links{display:grid;gap:12px}
.btn{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;text-decoration:none;color:var(--tx);border:1px solid var(--line);background:rgba(var(--dot),.07);transition:.3s;position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.25),transparent);transform:skewX(-20deg);transition:.7s}
.btn:hover{transform:translateY(-4px);border-color:var(--a);box-shadow:0 18px 36px -16px var(--a)}
.btn:hover::after{left:130%}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:#fff;flex:none}
.ph .ic{background:linear-gradient(135deg,#10b981,var(--b))}
.ig .ic{background:linear-gradient(135deg,#fbbf24,var(--c),var(--a))}
.btn small{display:block;color:var(--mut);font-size:12px}
.btn strong{font-size:16px;word-break:break-all}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.copy{margin-left:auto;font:600 12px inherit;font-family:inherit;color:var(--tx);border:1px solid var(--line);border-radius:99px;padding:7px 12px;background:rgba(var(--dot),.12);cursor:pointer;position:relative;z-index:2}
footer{text-align:center;color:var(--mut);font-size:12px;margin-top:26px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.skill{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="net"></canvas>
<div class="stage"><div class="card" id="card"><div class="in" id="in">
  <div class="av"><div class="ring"><i></i></div><div class="ring r2"></div><div class="core">PA</div></div>
  <h1><span class="grad">Pirniyazov Alpamis</span></h1>
  <div class="badge">AI / ML mutaxassisi</div>
  <p class="role"><span id="typed"></span><span class="cur"></span></p>

  <h2>Koʻnikmalar</h2>
  <div id="skills"></div>

  <h2>Texnologiyalar</h2>
  <div class="tags"><span>Python</span><span>PyTorch</span><span>TensorFlow</span><span>scikit-learn</span><span>OpenCV</span><span>Hugging Face</span><span>LangChain</span><span>FastAPI</span><span>Docker</span><span>SQL</span></div>

  <h2>Aloqa</h2>
  <div class="links">
    <a class="btn ph" href="tel:+9989308790955">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></div>
      <div><small>Telefon</small><strong>+9989308790955</strong></div>
      <button class="copy" id="copy" type="button">Nusxa</button>
    </a>
    <a class="btn ig" href="https://instagram.com/alpamis4053" target="_blank" rel="noopener">
      <div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg></div>
      <div><small>Instagram</small><strong>@alpamis4053</strong></div>
    </a>
  </div>
  <footer>© 2026 Pirniyazov Alpamis</footer>
</div></div></div>
<script>
const skills=[["Mashinaviy oʻqitish (ML)",92],["Deep Learning",88],["NLP va LLM",85],["Computer Vision",80],["Python",95],["MLOps va Deploy",72]];
const box=document.getElementById("skills");
box.innerHTML=skills.map((s,i)=>`<div class="skill" style="transition-delay:${.5+i*.12}s"><div class="row">${s[0]}<i>${s[1]}%</i></div><div class="bar"><div data-w="${s[1]}"></div></div></div>`).join("");
setTimeout(()=>{box.classList.add("on");box.querySelectorAll(".bar div").forEach(b=>b.style.width=b.dataset.w+"%")},300);
const words=["Neyron tarmoqlar yarataman","Chat-botlar va LLM","Kompyuter koʻrish tizimlari","Ma’lumotlardan qiymat yarataman"];
const t=document.getElementById("typed");let w=0,c=0,del=false;
(function tick(){const cur=words[w];t.textContent=cur.slice(0,c);
 if(!del&&c<cur.length){c++;setTimeout(tick,80)}
 else if(!del){del=true;setTimeout(tick,1500)}
 else if(c>0){c--;setTimeout(tick,35)}
 else{del=false;w=(w+1)%words.length;setTimeout(tick,300)}})();
document.getElementById("copy").addEventListener("click",e=>{e.preventDefault();e.stopPropagation();
 try{navigator.clipboard.writeText("+9989308790955");e.target.textContent="Nusxalandi ✓";setTimeout(()=>e.target.textContent="Nusxa",1600)}catch(_){}});
/* 3D tilt + yorugʻlik */
const card=document.getElementById("card"),inn=document.getElementById("in");
card.addEventListener("pointermove",e=>{if(e.pointerType==="touch")return;const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 card.style.transform=`rotateY(${(x-.5)*7}deg) rotateX(${(.5-y)*7}deg)`;inn.style.setProperty("--mx",x*100+"%");inn.style.setProperty("--my",y*100+"%")});
card.addEventListener("pointerleave",()=>card.style.transform="");
/* neyron tarmoq fon */
const cv=document.getElementById("net"),cx=cv.getContext("2d");let W,H,P=[],m={x:-999,y:-999};
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;const n=Math.min(70,Math.floor(W*H/22000));P=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5}))}
addEventListener("resize",size);addEventListener("pointermove",e=>{m.x=e.clientX;m.y=e.clientY});size();
(function loop(){const col=getComputedStyle(document.documentElement).getPropertyValue("--dot").trim()||"120,140,255";cx.clearRect(0,0,W,H);
 for(const p of P){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
  const dx=p.x-m.x,dy=p.y-m.y,d=Math.hypot(dx,dy);if(d<140){p.x+=dx/d*1.2;p.y+=dy/d*1.2}
  cx.beginPath();cx.arc(p.x,p.y,2,0,6.3);cx.fillStyle=`rgba(${col},.8)`;cx.fill()}
 for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const d=Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
  if(d<130){cx.strokeStyle=`rgba(${col},${(1-d/130)*.35})`;cx.lineWidth=1;cx.beginPath();cx.moveTo(P[i].x,P[i].y);cx.lineTo(P[j].x,P[j].y);cx.stroke()}}
 requestAnimationFrame(loop)})();
</script>
</body>
</html>
